name: Offline held-out harness 67

on:
  pull_request:
    paths:
      - 'scripts/offline_heldout67.py'
      - 'scripts/offline_revocation67.py'
      - 'tests/test_offline_heldout67.py'
      - '.github/workflows/offline-heldout-67.yml'
      - 'docs/OFFLINE_HELDOUT_67.md'
      - 'docs/reviews/ISSUE_67_HELDOUT_REVIEW.md'
      - 'docs/STATUS.md'

permissions:
  contents: read

jobs:
  offline-heldout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test public dummy records in an isolated network namespace
        run: |
          sudo unshare --net -- sh -eu -c '
            ip -brief link
            test -z "$(ip route show)"
            test -z "$(ip -6 route show)"
            python3 -B -m unittest discover -s tests -p "test_offline_heldout67.py" -v
          '
