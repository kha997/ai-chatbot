name: Offline corpus qualification 63

on:
  pull_request:
    paths:
      - 'eval/offline63/**'
      - 'scripts/offline_corpus63.py'
      - 'tests/test_offline_corpus63.py'
      - '.github/workflows/offline-corpus-63.yml'
      - 'docs/OFFLINE_CORPUS_63.md'
      - 'docs/reviews/ISSUE_63_CORPUS_REVIEW.md'
      - 'docs/STATUS.md'

permissions:
  contents: read

jobs:
  offline-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate public artifacts and run corpus tests in a network namespace
        run: |
          sudo unshare --net -- sh -eu -c '
            ip -brief address
            test -z "$(ip route show)"
            python3 -B -m scripts.offline_corpus63
            python3 -B -m unittest discover -s tests -p "test_offline_corpus63.py" -v
          '
